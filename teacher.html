<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - MIT ADT VLAB</title>
    <link rel="stylesheet" href="vlab.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            background: var(--bg-page); 
            padding: 40px; 
            color: var(--text-main); 
            font-family: var(--font-sans); 
            transition: all 0.3s ease;
        }
        .teacher-container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 24px; }
        .student-card { 
            background: var(--glass); 
            border: 1px solid var(--border); 
            padding: 24px; 
            border-radius: 24px;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }
        .student-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
        .student-name { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
        .student-email { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }
        .progress-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-top: 1px solid var(--border);
            font-size: 14px;
        }
        .status-badge { 
            padding: 4px 10px; border-radius: 100px; font-size: 10px; font-weight: 800; 
            text-transform: uppercase;
        }
        .status-complete { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .status-pending { background: rgba(245, 158, 11, 0.1); color: var(--accent); }
        .btn-action { 
            background: var(--bg-alt); color: var(--text-main); border: 1px solid var(--border); 
            padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 700; 
            font-size: 12px; transition: all 0.3s; margin-top: 15px; width: 100%;
        }
        .btn-action:hover { background: var(--primary); color: white; border-color: var(--primary); }
        
        /* Modal Styles */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: var(--bg-card); border: 1px solid var(--border);
            width: 90%; max-width: 800px; max-height: 80vh; overflow-y: auto;
            border-radius: 32px; padding: 40px; position: relative;
        }
        .close-modal { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 24px; color: var(--text-muted); }
        .eval-section { margin-top: 30px; padding-top: 20px; border-top: 2px dashed var(--border); }
        .eval-box { width: 100%; background: var(--bg-page); border: 1px solid var(--border); border-radius: 12px; padding: 15px; color: var(--text-main); margin: 10px 0; }
        
        [data-theme="light"] .student-card { background: #ffffff; }
    </style>
    <script>
        function initTheme() {
            const savedTheme = localStorage.getItem('vlab_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
        initTheme();
    </script>
</head>
<body>
    <div class="teacher-container">
        <div class="header">
            <div>
                <h1 onclick="location.href='index.html'" style="cursor:pointer">MIT ADT <span style="color:var(--primary)">Instructor Portal</span></h1>
                <p style="color: var(--text-muted);">Institutional verification and academic assessment dashboard.</p>
            </div>
            <button class="btn-back" onclick="location.href='dashboard.html'">Back to Hub</button>
        </div>

        <div id="studentList" class="student-grid">
            <div style="grid-column: 1/-1; text-align: center; padding: 100px; color: #64748b;">
                <div class="pulse" style="width:40px; height:40px; background:var(--primary); border-radius:50%; margin:0 auto 20px;"></div>
                Syncing academic records...
            </div>
        </div>
    </div>

    <!-- Student Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="document.getElementById('detailModal').style.display='none'">&times;</span>
            <div id="modal-body">
                <!-- Injected via JS -->
            </div>
            <div class="eval-section">
                <h3>Academic Evaluation</h3>
                <p style="color:var(--text-muted); font-size:14px;">Provide feedback and finalize institutional grading for this student.</p>
                <textarea id="eval-comment" class="eval-box" placeholder="Enter academic critique or feedback..."></textarea>
                <div style="display:flex; gap:10px;">
                    <button class="btn-back" style="flex:1" onclick="submitEvaluation('Approved')">✅ Approve & Verify</button>
                    <button class="btn-back" style="flex:1; background:var(--danger)" onclick="submitEvaluation('Needs Revision')">❌ Needs Revision</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBaYFXyCpq60TC-op86g5cO5laHA5_bC10",
            authDomain: "vlab-b1761.firebaseapp.com",
            projectId: "vlab-b1761",
            storageBucket: "vlab-b1761.firebasestorage.app",
            messagingSenderId: "83114402229",
            appId: "1:83114402229:web:be4e43415868e57ecaf9fc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const authUid = localStorage.getItem('vlab_user_uid');
        let selectedStudentId = null;

        async function verifyAccess() {
            if (!authUid) { location.href = 'login.html'; return; }
            
            // Wait for Auth to initialize
            const user = await new Promise((resolve) => {
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    unsubscribe();
                    resolve(u);
                });
            });

            if (!user) {
                location.href = 'login.html';
                return;
            }

            try {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (!userDoc.exists() || userDoc.data().role !== 'teacher') {
                    alert("Unauthorized access. Instructor privileges required.");
                    location.href = 'dashboard.html';
                } else {
                    loadStudents();
                }
            } catch (e) { 
                console.error("Access verification failed:", e);
                location.href = 'login.html'; 
            }
        }

        async function loadStudents() {
            const list = document.getElementById('studentList');
            const summary = document.getElementById('cohort-summary');
            try {
                // Fetch all users and filter in JS to avoid Index requirement errors
                const allUsersSnap = await getDocs(collection(db, "users"));
                const students = allUsersSnap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .filter(u => u.role === 'student');

                list.innerHTML = '';

                if (students.length === 0) {
                    list.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 100px; color: #64748b;">No active students found in the cohort.</div>';
                    return;
                }

                let totalScore = 0;
                let certCount = 0;
                let scoreCount = 0;
                for (const student of students) {
                    const card = document.createElement('div');
                    card.className = 'student-card';
                    
                    const progSnap = await getDocs(collection(db, "users", student.id, "progress"));
                    let progressHtml = '';
                    let completedCount = 0;
                    
                    progSnap.forEach(progDoc => {
                        const p = progDoc.data();
                        if (p.completed) {
                            completedCount++;
                            if (p.posttestScore) {
                                totalScore += p.posttestScore;
                                scoreCount++;
                            }
                        }
                        progressHtml += `
                            <div class="progress-item">
                                <span style="font-weight:700;">${progDoc.id.toUpperCase()}</span>
                                <div>
                                    <span class="status-badge ${p.completed ? 'status-complete' : 'status-pending'}">
                                        ${p.completed ? 'COMPLETED' : 'IN PROGRESS'}
                                    </span>
                                    <span style="margin-left: 10px; font-weight: 800; color:var(--primary);">${p.posttestScore || 0}%</span>
                                </div>
                            </div>
                        `;
                    });

                    if (completedCount > 0) certCount++;

                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div>
                                <div class="student-name">${student.name}</div>
                                <div class="student-email">${student.email}</div>
                            </div>
                            <div style="background:var(--primary); color:white; font-size:10px; padding:4px 10px; border-radius:100px; font-weight:800;">
                                ${completedCount} LABS DONE
                            </div>
                        </div>
                        <div class="progress-section" style="margin-top:10px; flex:1;">
                            ${progressHtml || '<p style="color:var(--text-muted); font-size:12px; padding:20px 0;">No data recorded.</p>'}
                        </div>
                        <button class="btn-action" onclick="window.viewDetails('${student.id}', '${student.name}')">🔬 REVIEW ACADEMIC REPORT</button>
                    `;
                    list.appendChild(card);
                }

                // Update Summary Stats
                document.getElementById('avgScore').textContent = scoreCount > 0 ? `${Math.round(totalScore / scoreCount)}%` : '--%';
                document.getElementById('certCount').textContent = certCount;
                document.getElementById('activeCount').textContent = students.length;

            } catch (e) {
                console.error(e);
                list.innerHTML = '<div style="color: #ef4444; text-align:center; grid-column:1/-1;">Error syncing telemetry data.</div>';
            }
        }

        window.viewDetails = async (id, name) => {
            selectedStudentId = id;
            const modal = document.getElementById('detailModal');
            const body = document.getElementById('modal-body');
            modal.style.display = 'flex';
            body.innerHTML = `<h2>${name}</h2><p>Loading detailed telemetry...</p>`;
            
            try {
                const progSnap = await getDocs(collection(db, "users", id, "progress"));
                let html = `<h2 style="margin-bottom:10px;">${name}</h2><p style="color:var(--text-muted); margin-bottom:30px;">Institutional UID: ${id}</p>`;
                
                progSnap.forEach(doc => {
                    const data = doc.data();
                    html += `
                        <div class="theory-card" style="margin-bottom:20px; background:var(--bg-page);">
                            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                                <h3 style="color:var(--primary);">${doc.id.toUpperCase()}</h3>
                                <span class="status-badge ${data.completed ? 'status-complete' : 'status-pending'}">${data.completed ? 'CERTIFIED' : 'PENDING'}</span>
                            </div>
                            <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; text-align:center;">
                                <div><small style="color:var(--text-muted);">PRETEST</small><div style="font-size:24px; font-weight:800;">${data.pretestScore || 0}%</div></div>
                                <div><small style="color:var(--text-muted);">POSTTEST</small><div style="font-size:24px; font-weight:800;">${data.posttestScore || 0}%</div></div>
                                <div><small style="color:var(--text-muted);">ACCURACY</small><div style="font-size:24px; font-weight:800; color:var(--success);">${Math.round((data.pretestScore + data.posttestScore)/2) || 0}%</div></div>
                            </div>
                            ${data.feedback ? `<div style="margin-top:15px; padding:10px; background:rgba(0,0,0,0.1); border-radius:8px; font-size:12px;"><b>Student Feedback:</b> ${data.feedback}</div>` : ''}
                        </div>
                    `;
                });
                body.innerHTML = html;
            } catch (e) { body.innerHTML = 'Error loading report.'; }
        };

        window.submitEvaluation = async (status) => {
            if (!selectedStudentId) return;
            const comment = document.getElementById('eval-comment').value;
            try {
                await setDoc(doc(db, "users", selectedStudentId, "evaluation", "final"), {
                    instructorUid: authUid,
                    instructorName: localStorage.getItem('vlab_user_name') || 'Instructor',
                    status: status,
                    comment: comment,
                    timestamp: new Date().toISOString()
                }, { merge: true });
                alert(`Academic evaluation submitted: ${status}`);
                document.getElementById('detailModal').style.display = 'none';
            } catch (e) { alert("Evaluation sync failed."); }
        };

        verifyAccess();
    </script>
</body>
</html>
